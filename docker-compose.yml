version: "3.9"

services:
  # ===================================================
  # PostgreSQL Database
  # ===================================================
  postgres:
    image: postgres:16-alpine
    container_name: visaflowpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: visaflowpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visaflowpro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visaflow-network

  # ===================================================
  # Redis (Cache & Rate Limiting)
  # ===================================================
  redis:
    image: redis:7-alpine
    container_name: visaflowpro-redis
    restart: unless-stopped
    command: redis-server --requirepass visaflowredis --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visaflow-network

  # ===================================================
  # Next.js Application
  # ===================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: visaflowpro-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/visaflowpro
      - REDIS_URL=redis://:visaflowredis@redis:6379
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visaflow-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`visaflowpro.tn`)"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"

  # ===================================================
  # Nginx Reverse Proxy (Dev)
  # ===================================================
  nginx:
    image: nginx:alpine
    container_name: visaflowpro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - visaflow-network
    profiles:
      - production

  # ===================================================
  # Adminer (DB Management - Dev Only)
  # ===================================================
  adminer:
    image: adminer:latest
    container_name: visaflowpro-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: hydra
    depends_on:
      - postgres
    networks:
      - visaflow-network
    profiles:
      - dev

networks:
  visaflow-network:
    driver: bridge
    name: visaflow-network

volumes:
  postgres_data:
    name: visaflowpro-postgres
  redis_data:
    name: visaflowpro-redis
